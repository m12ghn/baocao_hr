<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Báo cáo nhân sự – Cụm M12</title>
<style>
  html,body{height:100%;margin:0;font-family:system-ui,sans-serif}
  body{display:flex;flex-direction:column;background:#f4f5f7}
  header{display:flex;align-items:center;gap:12px;padding:8px 16px;background:#1f2937;color:#fff}
  header b{font-size:15px}
  select{font-size:14px;padding:5px 8px;border-radius:6px;border:0}
  #open{color:#9ca3af;font-size:13px;margin-left:auto}
  iframe{flex:1;border:0;width:100%;background:#fff}
</style>
</head>
<body>
<header>
  <b>Báo cáo nhân sự – Cụm M12</b>
  <select id="sel" aria-label="Chọn tuần"></select>
  <a id="open" href="#" target="_blank" rel="noopener">Mở toàn trang ↗</a>
</header>
<iframe id="f" title="Báo cáo"></iframe>
<script>
fetch('reports.json').then(r=>r.json()).then(list=>{
  const sel=document.getElementById('sel'), f=document.getElementById('f'), open=document.getElementById('open');
  list.forEach((r,i)=>{
    const o=document.createElement('option');
    o.value=r.id;
    o.textContent=r.label+(i===0?' – mới nhất':'');
    sel.appendChild(o);
  });
  function show(id){
    const r=list.find(x=>x.id===id)||list[0];
    sel.value=r.id; f.src=r.file; open.href=r.file;
    history.replaceState(null,'','#'+r.id);
  }
  sel.onchange=()=>show(sel.value);
  show(location.hash.slice(1));
});
</script>
</body>
</html>
